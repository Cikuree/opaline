name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew build
      - name: Launcher Rust
        run: |
          if [ -f launcher/Cargo.toml ]; then
            cd launcher
            cargo clippy -- -D warnings
            cargo test
          fi
