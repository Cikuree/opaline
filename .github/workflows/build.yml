name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew build
      - name: Launcher Rust
        run: |
          if [ -f launcher/Cargo.toml ]; then
            cd launcher
            cargo clippy -- -D warnings
            cargo test
          fi
      - name: Opaline (Tauri)
        run: |
          if [ -f opaline/src-tauri/Cargo.toml ]; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
            cd opaline/src-tauri
            cargo clippy --locked -- -D warnings
            cargo test --locked
          fi
      - name: Packs
        run: python3 scripts/pack-tools.py catalog --tag v0.0.0 --repo Cikuree/opaline --out "$RUNNER_TEMP/packs.json"
