name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: classroom-launcher.exe
            asset: classroom-launcher-windows.exe
          - os: ubuntu-latest
            bin: classroom-launcher
            asset: classroom-launcher-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Verifier version launcher == tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -n1)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != launcher $v"; exit 1; }
      - name: Build launcher
        run: |
          cd launcher
          cargo build --release
          mkdir -p ../dist
          cp "target/release/${{ matrix.bin }}" "../dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  release:
    needs: launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Verifier version == tag
        run: |
          v=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: ./gradlew build
      - uses: actions/download-artifact@v4
        with:
          path: dist/launchers
          merge-multiple: true
      - name: Manifeste et instance Prism
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jar=$(ls build/libs/classroomrun-*.jar | grep -v -- '-sources' | head -n1)
          [ "$(basename "$jar")" = "classroomrun-$VERSION.jar" ] || { echo "jar inattendu: $jar"; exit 1; }
          echo "JAR=$jar" >> "$GITHUB_ENV"
          python3 scripts/pack-tools.py add-jar --jar "$jar" --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          python3 scripts/build-prism-instance.py --jar "$jar" --out dist/classroom-run-prism.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # pack.zip : contenu de pack/ a la racine, avec classroomrun.pw.toml et index recalcules
          zip -qr dist/pack.zip pack
          PACK_HASH=$(python3 -c "import tomllib;print(tomllib.load(open('pack/pack.toml','rb'))['index']['hash'])")
          printf '{"version":"%s","windows":"%s/classroom-launcher-windows.exe","linux":"%s/classroom-launcher-linux","pack":"%s/pack.zip","pack_hash":"%s"}\n' \
            "$VERSION" "$BASE" "$BASE" "$BASE" "$PACK_HASH" > dist/launcher.json
          gh release create "$GITHUB_REF_NAME" "$JAR" dist/launchers/* dist/classroom-run-prism.zip dist/pack.zip dist/launcher.json \
            --title "$GITHUB_REF_NAME" --generate-notes
