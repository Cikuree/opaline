name: packs
# Publie packs.json et pack-<id>.zip sur la release permanente « packs » (contrat Opaline §2).
on:
  push:
    branches: [main]
    # le mod est compilé ici : un changement du mod publie le pack sans nouvelle version d'Opaline
    paths: ['packs/**', 'scripts/pack-tools.py', '.github/workflows/packs.yml', 'src/**', 'build.gradle', 'gradle.properties', 'settings.gradle', 'gradle/**']
  workflow_dispatch:
  workflow_call: # appelé par release.yml : un tag publié avec GITHUB_TOKEN ne déclenche pas d'autre workflow
permissions:
  contents: write
concurrency:
  group: packs
  cancel-in-progress: false
jobs:
  packs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew build
      - name: Jar du mod sur la release packs
        run: |
          v=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          jar="build/libs/classroomrun-$v.jar"
          [ -f "$jar" ] || { echo "jar manquant: $jar"; ls build/libs; exit 1; }
          gh release view packs >/dev/null 2>&1 || gh release create packs --target main --prerelease --title "Packs Opaline" --notes "Catalogue et packs d Opaline."
          gh release upload packs "$jar" --clobber
          python3 scripts/pack-tools.py add-jar --pack packs/classroom-run --jar "$jar" --version "$v" --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/packs/"
      - name: Index, zips et catalogue
        run: |
          for d in packs/*/; do python3 scripts/pack-tools.py index --pack "$d"; done
          mkdir -p dist
          for d in packs/*/; do
            python3 scripts/pack-tools.py zip --pack "$d" --out "dist/pack-$(basename "$d").zip"
          done
          python3 scripts/pack-tools.py catalog --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/packs/" --out dist/packs.json
      - name: Publier sur la release packs
        run: |
          ids=$(for d in packs/*/; do printf -- '- %s\n' "$(basename "$d")"; done)
          notes=$(printf 'Catalogue et packs d Opaline, mis à jour le %s.\n\nPacks :\n%s\n' "$(date -u +%F)" "$ids")
          gh release view packs >/dev/null 2>&1 || gh release create packs --target main --prerelease --title "Packs Opaline" --notes "$notes"
          gh release upload packs dist/packs.json dist/pack-*.zip --clobber
          gh release edit packs --prerelease --title "Packs Opaline" --notes "$notes"
