plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'CasualChampionships'
		url = 'https://maven.casualchampionships.net/snapshots'
		content {
			includeGroup 'net.casualchampionships'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"classroomrun" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fantasy (runtime worlds), shipped inside our jar
	implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
	include "xyz.nucleoid:fantasy:${project.fantasy_version}"

	// Optional replay mods: compile-only, the code touching them lives in classes loaded only when the mod is present.
	// ServerReplay ships arcade-replay as a nested jar (not visible to javac), hence the separate artifact.
	compileOnly "maven.modrinth:server-replay:${project.server_replay_version}"
	compileOnly "net.casualchampionships:arcade-replay:${project.arcade_version}"
	clientCompileOnly "maven.modrinth:replaymod:${project.replaymod_version}"
	// Dev runtime only (runServer): records a .mcpr per player. ServerReplay needs Fabric Language Kotlin.
	localRuntime "maven.modrinth:server-replay:${project.server_replay_version}"
	localRuntime "maven.modrinth:fabric-language-kotlin:${project.flk_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
