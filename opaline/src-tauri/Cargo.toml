[package]
name = "opaline"
version = "0.6.8"
edition = "2024"
description = "Opaline, launcher Minecraft"
publish = false

[lib]
name = "opaline"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
discord-rich-presence = "1.1.0"
opaline_core = { version = "0.6.8", path = "../../launcher" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
