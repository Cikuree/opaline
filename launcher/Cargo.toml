[package]
name = "opaline_core"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
flate2 = "1.1.10"
getrandom = "0.4"
hex = "0.4.3"
keyring = "4.2.0"
md-5 = "0.11.0"
open = "5.4.5"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
uuid = "1.29.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lib]
name = "opaline_core"
path = "src/lib.rs"

[[bin]]
name = "opaline-cli"
path = "src/bin/opaline-cli.rs"
