[package]
name = "classroom-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
flate2 = "1.1.10"
hex = "0.4.3"
keyring = "4.2.0"
md-5 = "0.11.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
uuid = "1.29.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
